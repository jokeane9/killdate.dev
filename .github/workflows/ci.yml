name: CI

on:
  pull_request:
    branches: [main]

# Build check on every PR — catches Astro build failures before they hit main.
# deploy.yml handles the actual S3 sync + CloudFront invalidation on merge to main.

jobs:
  build:
    name: Astro build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed — dist/ not created"
            exit 1
          fi
          echo "Build succeeded — $(find dist -type f | wc -l | tr -d ' ') files in dist/"
